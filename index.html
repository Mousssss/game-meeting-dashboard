<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏项目周会 · 资源展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --neon-purple: #b829dd;
            --neon-pink: #ff006e;
            --neon-blue: #00d4ff;
            --neon-cyan: #00f5ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            overflow: hidden;
        }

        /* 动态背景光效 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(184, 41, 221, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 0, 110, 0.1) 0%, transparent 40%);
            animation: bgFloat 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(1deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        /* 顶部标题栏 */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            box-shadow: var(--glass-shadow);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #fff 0%, #a8b2d1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-icon {
            font-size: 24px;
        }

        /* 主布局 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 260px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 8px;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 12px;
        }

        /* 导航项 - 纯文字 */
        .nav-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(2px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .nav-content {
            flex: 1;
            min-width: 0;
        }

        .nav-title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 2px;
        }

        .nav-desc {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 导航组样式 */
        .nav-group {
            display: flex;
            flex-direction: column;
        }

        .nav-group-header {
            position: relative;
        }

        .nav-arrow {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            transition: transform 0.2s;
            margin-left: auto;
        }

        .nav-group.expanded .nav-arrow {
            transform: rotate(90deg);
        }

        .nav-subitems {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding-left: 16px;
            margin-top: 6px;
        }

        .nav-group.expanded .nav-subitems {
            display: flex;
        }

        .nav-subitem {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
        }

        .nav-subitem:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-subitem.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-color: rgba(102, 126, 234, 0.4);
        }

        /* 快捷操作 */
        .quick-actions {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            border-color: rgba(102, 126, 234, 0.5);
            color: rgba(255,255,255,0.9);
        }

        /* 内容区域 */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .toolbar {
            height: 50px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }

        .url-display {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            font-family: 'SF Mono', Monaco, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tool-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .tool-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .tool-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 子 Tab 栏 */
        .sub-tabs {
            display: none;
            height: 44px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 20px;
            align-items: center;
            gap: 8px;
        }

        .sub-tabs.show {
            display: flex;
        }

        .sub-tab {
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: rgba(255,255,255,0.5);
        }

        .sub-tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255,255,255,0.8);
        }

        .sub-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* iframe 容器 */
        .iframe-container {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.1);
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* 加载状态 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255,255,255,0.6);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255,255,255,0.5);
            padding: 40px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 300px;
            line-height: 1.6;
        }

        /* 外部链接提示样式 */
        .external-link-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .external-link-prompt h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 12px;
        }

        .external-link-prompt p {
            color: rgba(255,255,255,0.6);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .external-link-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .external-link-btn:hover {
            opacity: 0.9;
        }

        /* 编辑弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            padding: 24px;
            width: 480px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
        }

        .modal h3 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255,255,255,0.7);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                z-index: 100;
                height: auto;
                max-height: 50vh;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
            }

            .main-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>🎮 游戏项目周会 · 资源展示</h1>
        <span id="current-time"></span>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="nav-section">
                <div class="nav-section-title">会议资源</div>
                
                <div class="nav-item active" data-index="0" onclick="switchTab(0)">
                    <div class="nav-content">
                        <div class="nav-title">设计排期表</div>
                        <div class="nav-desc">腾讯文档 - 项目排期</div>
                    </div>
                </div>

                <div class="nav-item" data-index="1" onclick="switchTab(1)">
                    <div class="nav-content">
                        <div class="nav-title">方案汇总表</div>
                        <div class="nav-desc">腾讯文档 - 方案整理</div>
                    </div>
                </div>

                <div class="nav-item" data-index="2" onclick="switchTab(2)">
                    <div class="nav-content">
                        <div class="nav-title">猫耳市集设计</div>
                        <div class="nav-desc">Figma - UI/UX 设计</div>
                    </div>
                </div>

                <div class="nav-group">
                    <div class="nav-item nav-group-header" data-index="3" onclick="toggleGroup(3)">
                        <div class="nav-content">
                            <div class="nav-title">场景立绘</div>
                            <div class="nav-desc">Figma - 美术资源</div>
                        </div>
                        <div class="nav-arrow">▶</div>
                    </div>
                    <div class="nav-subitems" id="group-3">
                        <div class="nav-item nav-subitem" data-index="3" data-subindex="0" onclick="switchTab(3, 0)">
                            <div class="nav-content">
                                <div class="nav-title">一期资源</div>
                            </div>
                        </div>
                        <div class="nav-item nav-subitem" data-index="3" data-subindex="1" onclick="switchTab(3, 1)">
                            <div class="nav-content">
                                <div class="nav-title">二期资源需求</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="nav-item" data-index="4" onclick="switchTab(4)">
                    <div class="nav-content">
                        <div class="nav-title">原画共享表</div>
                        <div class="nav-desc">Canva - 美术资源</div>
                    </div>
                </div>
            </div>

            <div class="quick-actions">
                <button class="action-btn" onclick="openEditModal()">编辑链接地址</button>
            </div>
        </aside>

        <main class="content-area">
            <div class="toolbar">
                <div class="url-display" id="url-display">点击左侧切换资源...</div>
                <button class="tool-btn secondary" onclick="refreshFrame()">刷新</button>
                <button class="tool-btn" onclick="openInNewTab()">新标签打开</button>
            </div>
            
            <div class="sub-tabs" id="sub-tabs">
                <div class="sub-tab active" data-subindex="0" onclick="switchSubTab(0)">一期资源</div>
                <div class="sub-tab" data-subindex="1" onclick="switchSubTab(1)">二期资源需求</div>
            </div>
            
            <div class="iframe-container" id="iframe-container">
                <div class="empty-state">
                    <h3>选择左侧资源开始展示</h3>
                    <p>点击左侧导航栏中的项目，即可在此处展示对应的内容</p>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <h3>编辑资源链接</h3>
            <div id="edit-forms"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn-save" onclick="saveLinks()">保存</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG_VERSION = 5;

        const defaultConfig = [
            {
                name: "设计排期表",
                type: "腾讯文档",
                url: "https://doc.weixin.qq.com/smartsheet/s3_AD4AmgbsADgCN4Q8LjjrlT7GH14cF?scode=ANYAEAdoABEyhUTWuWAD4AmgbsADg&tab=5v8j9u&viewId=vXzANM",
                desc: "智能表格 - 项目排期跟踪"
            },
            {
                name: "方案汇总表",
                type: "腾讯文档",
                url: "https://doc.weixin.qq.com/sheet/e3_ARoAOAZwAKoCNwQkAe12rTve0r3t3?scode=ANYAEAdoABEANLIZ4tAD4AmgbsADg&tab=gg88rc",
                desc: "表格 - 方案汇总整理"
            },
            {
                name: "猫耳市集设计",
                type: "Figma",
                url: "https://www.figma.com/design/BD5yWZD7sAohhOGMKDXA1a/%E7%8C%AB%E8%80%B3%E5%B8%82%E9%9B%86?node-id=2646-6&t=Os8QFH0oBeVZPaJG-1",
                desc: "UI/UX 主设计方案"
            },
            {
                name: "场景立绘",
                type: "Figma",
                isGroup: true,
                baseUrl: "https://www.figma.com/design/mx6TmWTBvzD3UgvlUV07Im/%E7%8C%AB%E8%80%B3%E5%B8%82%E9%9B%86%E5%9C%BA%E6%99%AF-%E7%AB%8B%E7%BB%98",
                pages: [
                    { name: "一期资源", nodeId: "0-1" },
                    { name: "二期资源需求", nodeId: "532-5" }
                ],
                desc: "美术资源 - 场景与立绘"
            },
            {
                name: "原画共享表",
                type: "Canva",
                url: "https://www.canva.cn/design/DAHCZyw0w4U/KfOdxMgbpZatrK0Kjf576w/edit",
                desc: "可画 - 美术原画资源共享"
            }
        ];

        const savedVersion = localStorage.getItem('meetingConfigVersion');
        let config = (savedVersion == CONFIG_VERSION) ? (JSON.parse(localStorage.getItem('meetingConfig')) || defaultConfig) : defaultConfig;
        localStorage.setItem('meetingConfigVersion', CONFIG_VERSION);

        let currentIndex = -1;
        let currentSubIndex = 0;
        let expandedGroup = null;

        document.addEventListener('DOMContentLoaded', () => {
            updateTime();
            setInterval(updateTime, 1000);
            
            expandedGroup = localStorage.getItem('expandedGroup');
            if (expandedGroup !== null) {
                document.querySelector(`.nav-group:has([data-index="${expandedGroup}"])`)?.classList.add('expanded');
            }
            
            const savedIndex = localStorage.getItem('currentIndex');
            const savedSubIndex = localStorage.getItem('currentSubIndex');
            if (savedIndex !== null) {
                switchTab(parseInt(savedIndex), savedSubIndex !== null ? parseInt(savedSubIndex) : 0);
            }
        });

        function toggleGroup(index) {
            const group = document.querySelector(`.nav-group:has([data-index="${index}"])`);
            if (group) {
                const isExpanded = group.classList.contains('expanded');
                if (isExpanded) {
                    group.classList.remove('expanded');
                    expandedGroup = null;
                } else {
                    group.classList.add('expanded');
                    expandedGroup = index;
                }
                localStorage.setItem('expandedGroup', expandedGroup);
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleString('zh-CN', {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        function switchTab(index, subIndex = 0) {
            currentIndex = index;
            currentSubIndex = subIndex;
            localStorage.setItem('currentIndex', index);
            localStorage.setItem('currentSubIndex', subIndex);

            const item = config[index];
            
            if (item.isGroup) {
                const group = document.querySelector(`.nav-group:has([data-index="${index}"])`);
                if (group) {
                    group.classList.add('expanded');
                    expandedGroup = index;
                    localStorage.setItem('expandedGroup', expandedGroup);
                }
                document.getElementById('sub-tabs').classList.add('show');
                document.querySelectorAll('.sub-tab').forEach((tab, i) => {
                    tab.classList.toggle('active', i === subIndex);
                });
            } else {
                document.getElementById('sub-tabs').classList.remove('show');
            }

            document.querySelectorAll('.nav-item').forEach((navItem) => {
                const navIndex = parseInt(navItem.dataset.index);
                const navSubIndex = navItem.dataset.subindex !== undefined ? parseInt(navItem.dataset.subindex) : -1;
                navItem.classList.remove('active');
                if (navIndex === index) {
                    if (item.isGroup) {
                        if (navSubIndex === subIndex) navItem.classList.add('active');
                    } else {
                        navItem.classList.add('active');
                    }
                }
            });

            loadContent(item, subIndex);
        }

        function switchSubTab(subIndex) {
            if (currentIndex >= 0) switchTab(currentIndex, subIndex);
        }

        function loadContent(item, subIndex = 0) {
            const container = document.getElementById('iframe-container');
            const urlDisplay = document.getElementById('url-display');
            
            let displayUrl = item.url;
            if (item.isGroup && item.pages) {
                displayUrl = `${item.baseUrl}?node-id=${item.pages[subIndex].nodeId}`;
            }
            urlDisplay.textContent = displayUrl;

            if (item.type === '腾讯文档' || displayUrl.includes('doc.weixin.qq.com')) {
                container.innerHTML = `
                    <div class="external-link-prompt">
                        <h3>腾讯文档需要在新标签页打开</h3>
                        <p>由于企业微信安全限制，文档无法在页面内嵌入显示</p>
                        <button class="external-link-btn" onclick="window.open('${displayUrl}', '_blank')">在新标签页打开文档</button>
                    </div>`;
                return;
            }

            if (item.type === 'Canva' || displayUrl.includes('canva.')) {
                container.innerHTML = `
                    <div class="external-link-prompt">
                        <h3>Canva 需要在新标签页打开</h3>
                        <p>Canva 编辑模式不支持页面内嵌入显示</p>
                        <button class="external-link-btn" onclick="window.open('${displayUrl}', '_blank')">在新标签页打开 Canva</button>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载 ${item.isGroup ? item.pages[subIndex].name : item.name}...</p>
                </div>`;

            setTimeout(() => {
                let embedUrl = displayUrl;
                if (item.type === 'Figma' || displayUrl.includes('figma.com')) {
                    embedUrl = `https://www.figma.com/embed?embed_host=share&url=${encodeURIComponent(displayUrl)}`;
                }
                container.innerHTML = `<iframe src="${embedUrl}" allow="fullscreen" frameborder="0"></iframe>`;
            }, 500);
        }

        function refreshFrame() {
            if (currentIndex >= 0) switchTab(currentIndex, currentSubIndex);
        }

        function openInNewTab() {
            if (currentIndex >= 0) {
                const item = config[currentIndex];
                let url = item.url;
                if (item.isGroup && item.pages) {
                    url = `${item.baseUrl}?node-id=${item.pages[currentSubIndex].nodeId}`;
                }
                window.open(url, '_blank');
            }
        }

        function openEditModal() {
            const forms = document.getElementById('edit-forms');
            forms.innerHTML = config.map((item, index) => {
                if (item.isGroup) {
                    return `
                        <div class="form-group">
                            <label>${item.name} - 文件基础地址</label>
                            <input type="text" id="url-${index}-base" value="${item.baseUrl}" placeholder="Figma 文件基础链接">
                        </div>
                        ${item.pages.map((page, pIndex) => `
                            <div class="form-group" style="padding-left: 20px;">
                                <label>${page.name} - Node ID</label>
                                <input type="text" id="url-${index}-page-${pIndex}" value="${page.nodeId}" placeholder="node-id">
                            </div>
                        `).join('')}`;
                } else {
                    return `
                        <div class="form-group">
                            <label>${item.name} 链接地址</label>
                            <input type="text" id="url-${index}" value="${item.url}" placeholder="请输入 ${item.type} 链接">
                        </div>`;
                }
            }).join('');
            document.getElementById('edit-modal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('show');
        }

        function saveLinks() {
            config.forEach((item, index) => {
                if (item.isGroup) {
                    const baseInput = document.getElementById(`url-${index}-base`);
                    if (baseInput) item.baseUrl = baseInput.value.trim();
                    item.pages.forEach((page, pIndex) => {
                        const pageInput = document.getElementById(`url-${index}-page-${pIndex}`);
                        if (pageInput) page.nodeId = pageInput.value.trim();
                    });
                } else {
                    const input = document.getElementById(`url-${index}`);
                    if (input) item.url = input.value.trim();
                }
            });
            localStorage.setItem('meetingConfig', JSON.stringify(config));
            closeEditModal();
            if (currentIndex >= 0) switchTab(currentIndex, currentSubIndex);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5' && !e.ctrlKey && !e.metaKey) {
                const index = parseInt(e.key) - 1;
                if (index < config.length) switchTab(index, 0);
            }
            if (e.key === 'Tab' && currentIndex >= 0 && config[currentIndex].isGroup) {
                e.preventDefault();
                const item = config[currentIndex];
                switchTab(currentIndex, (currentSubIndex + 1) % item.pages.length);
            }
            if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                refreshFrame();
            }
        });

        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') closeEditModal();
        });
    </script>
</body>
</html>
