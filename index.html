<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏项目周会 · 资源展示</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --neon-purple: #b829dd;
            --neon-pink: #ff006e;
            --neon-blue: #00d4ff;
            --neon-cyan: #00f5ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            overflow: hidden;
        }

        /* 动态背景光效 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(184, 41, 221, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 0, 110, 0.1) 0%, transparent 40%);
            animation: bgFloat 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(1deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        /* 顶部标题栏 - Glassmorphism */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            color: white;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
            box-shadow: var(--glass-shadow);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #fff 0%, #a8b2d1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 10px rgba(184, 41, 221, 0.5));
        }

        #current-time {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* 主布局 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 5;
            padding: 24px;
            gap: 24px;
        }

        /* 左侧导航栏 - Glassmorphism */
        .sidebar {
            width: 300px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            padding: 28px;
            gap: 16px;
            overflow-y: auto;
            box-shadow: var(--glass-shadow);
        }

        .nav-section {
            margin-bottom: 8px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            padding-left: 8px;
        }

        /* 导航项 - Neon Glow */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(184, 41, 221, 0.1), rgba(0, 212, 255, 0.1));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .nav-item:hover {
            transform: translateY(-2px);
            border-color: rgba(184, 41, 221, 0.3);
            box-shadow: 0 8px 32px rgba(184, 41, 221, 0.2);
        }

        .nav-item:hover::before {
            opacity: 1;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(184, 41, 221, 0.2), rgba(0, 212, 255, 0.2));
            border-color: rgba(184, 41, 221, 0.5);
            box-shadow: 
                0 0 20px rgba(184, 41, 221, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .nav-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            background: linear-gradient(135deg, rgba(184, 41, 221, 0.3), rgba(0, 212, 255, 0.3));
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-content {
            flex: 1;
            min-width: 0;
        }

        .nav-title {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 4px;
        }

        .nav-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 导航组样式 */
        .nav-group {
            display: flex;
            flex-direction: column;
        }

        .nav-group-header {
            position: relative;
        }

        .nav-group-header .nav-icon {
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.3), rgba(184, 41, 221, 0.3)) !important;
        }

        .nav-arrow {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            transition: all 0.3s;
            margin-left: auto;
            padding-left: 8px;
        }

        .nav-group.expanded .nav-arrow {
            transform: rotate(90deg);
            color: var(--neon-purple);
        }

        .nav-subitems {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding-left: 20px;
            margin-top: 10px;
        }

        .nav-group.expanded .nav-subitems {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-subitem {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
        }

        .nav-subitem:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .nav-subitem.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(184, 41, 221, 0.15));
            border-color: rgba(0, 212, 255, 0.4);
        }

        .nav-subicon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: rgba(255,255,255,0.4);
        }

        .nav-subitem.active .nav-subicon {
            color: var(--neon-cyan);
        }

        /* 快捷操作 */
        .quick-actions {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            background: rgba(184, 41, 221, 0.1);
            box-shadow: 0 0 20px rgba(184, 41, 221, 0.2);
        }

        /* 内容区域 - Glassmorphism */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--glass-shadow);
        }

        .toolbar {
            height: 64px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 16px;
        }

        .url-display {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            font-family: 'SF Mono', Monaco, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tool-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(184, 41, 221, 0.8), rgba(0, 212, 255, 0.8));
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .tool-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .tool-btn:hover::before {
            left: 100%;
        }

        .tool-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(184, 41, 221, 0.4);
        }

        .tool-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .tool-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 子 Tab 栏 */
        .sub-tabs {
            display: none;
            height: 52px;
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 28px;
            align-items: center;
            gap: 12px;
        }

        .sub-tabs.show {
            display: flex;
        }

        .sub-tab {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: rgba(255,255,255,0.5);
            border: 1px solid transparent;
        }

        .sub-tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255,255,255,0.8);
        }

        .sub-tab.active {
            background: linear-gradient(135deg, rgba(184, 41, 221, 0.3), rgba(0, 212, 255, 0.3));
            color: white;
            border-color: rgba(184, 41, 221, 0.5);
            box-shadow: 0 4px 15px rgba(184, 41, 221, 0.2);
        }

        /* iframe 容器 */
        .iframe-container {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* 加载状态 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255,255,255,0.7);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--neon-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
            box-shadow: 0 0 20px rgba(184, 41, 221, 0.3);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255,255,255,0.5);
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 72px;
            margin-bottom: 24px;
            opacity: 0.6;
            filter: drop-shadow(0 0 20px rgba(184, 41, 221, 0.5));
        }

        .empty-state h3 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .empty-state p {
            font-size: 15px;
            max-width: 320px;
            line-height: 1.7;
            color: rgba(255,255,255,0.5);
        }

        /* 外部链接提示样式 */
        .external-link-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .external-link-prompt .icon {
            font-size: 64px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 20px rgba(184, 41, 221, 0.5));
        }

        .external-link-prompt h3 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .external-link-prompt p {
            color: rgba(255,255,255,0.6);
            margin-bottom: 28px;
            line-height: 1.7;
            max-width: 360px;
        }

        .external-link-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(184, 41, 221, 0.4);
        }

        .external-link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(184, 41, 221, 0.5);
        }

        /* 编辑弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 24px;
            padding: 32px;
            width: 520px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .modal h3 {
            margin-bottom: 24px;
            font-size: 20px;
            color: #fff;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(184, 41, 221, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 28px;
        }

        .modal-actions button {
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255,255,255,0.7);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-save {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: white;
            box-shadow: 0 4px 20px rgba(184, 41, 221, 0.3);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(184, 41, 221, 0.4);
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .sidebar {
                width: 260px;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding: 16px;
            }
            
            .sidebar {
                width: 100%;
                max-height: 40vh;
                border-radius: 20px;
            }
            
            .content-area {
                border-radius: 20px;
            }
        }

        /* 动画 */
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <!-- 顶部标题栏 -->
    <header class="header">
        <h1>
            <span class="header-icon">🎮</span>
            游戏项目周会 · 资源展示
        </h1>
        <span id="current-time"></span>
    </header>

    <!-- 主布局 -->
    <div class="main-container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="nav-section">
                <div class="nav-section-title">会议资源</div>
                
                <div class="nav-item active" data-index="0" onclick="switchTab(0)">
                    <div class="nav-icon">📅</div>
                    <div class="nav-content">
                        <div class="nav-title">设计排期表</div>
                        <div class="nav-desc">腾讯文档 - 项目排期</div>
                    </div>
                </div>

                <div class="nav-item" data-index="1" onclick="switchTab(1)">
                    <div class="nav-icon">📊</div>
                    <div class="nav-content">
                        <div class="nav-title">方案汇总表</div>
                        <div class="nav-desc">腾讯文档 - 方案整理</div>
                    </div>
                </div>

                <div class="nav-item" data-index="2" onclick="switchTab(2)">
                    <div class="nav-icon">🎨</div>
                    <div class="nav-content">
                        <div class="nav-title">猫耳市集设计</div>
                        <div class="nav-desc">Figma - UI/UX 设计</div>
                    </div>
                </div>

                <div class="nav-group">
                    <div class="nav-item nav-group-header" data-index="3" onclick="toggleGroup(3)">
                        <div class="nav-icon">🖼️</div>
                        <div class="nav-content">
                            <div class="nav-title">场景立绘</div>
                            <div class="nav-desc">Figma - 美术资源</div>
                        </div>
                        <div class="nav-arrow">▶</div>
                    </div>
                    <div class="nav-subitems" id="group-3">
                        <div class="nav-item nav-subitem" data-index="3" data-subindex="0" onclick="switchTab(3, 0)">
                            <div class="nav-subicon">•</div>
                            <div class="nav-content">
                                <div class="nav-title">一期资源</div>
                            </div>
                        </div>
                        <div class="nav-item nav-subitem" data-index="3" data-subindex="1" onclick="switchTab(3, 1)">
                            <div class="nav-subicon">•</div>
                            <div class="nav-content">
                                <div class="nav-title">二期资源需求</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="nav-item" data-index="4" onclick="switchTab(4)">
                    <div class="nav-icon">✨</div>
                    <div class="nav-content">
                        <div class="nav-title">原画共享表</div>
                        <div class="nav-desc">Canva - 美术资源</div>
                    </div>
                </div>
            </div>

            <div class="quick-actions">
                <button class="action-btn" onclick="openEditModal()">
                    <span>⚙️</span> 编辑链接地址
                </button>
            </div>
        </aside>

        <!-- 内容区域 -->
        <main class="content-area">
            <div class="toolbar">
                <div class="url-display" id="url-display">点击左侧切换资源...</div>
                <button class="tool-btn secondary" onclick="refreshFrame()">🔄 刷新</button>
                <button class="tool-btn" onclick="openInNewTab()">↗️ 新标签打开</button>
            </div>
            
            <!-- 子 Tab 栏（场景立绘专用） -->
            <div class="sub-tabs" id="sub-tabs">
                <div class="sub-tab active" data-subindex="0" onclick="switchSubTab(0)">一期资源</div>
                <div class="sub-tab" data-subindex="1" onclick="switchSubTab(1)">二期资源需求</div>
            </div>
            
            <div class="iframe-container" id="iframe-container">
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <h3>选择左侧资源开始展示</h3>
                    <p>点击左侧导航栏中的项目，即可在此处展示对应的内容</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <h3>编辑资源链接</h3>
            <div id="edit-forms">
                <!-- 动态生成 -->
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn-save" onclick="saveLinks()">保存设置</button>
            </div>
        </div>
    </div>

    <script>
        // 配置版本号，更新时递增以强制刷新用户配置
        const CONFIG_VERSION = 2;

        // 默认配置
        const defaultConfig = [
            {
                name: "设计排期表",
                type: "腾讯文档",
                icon: "📅",
                url: "https://doc.weixin.qq.com/smartsheet/s3_AD4AmgbsADgCN4Q8LjjrlT7GH14cF?scode=ANYAEAdoABEyhUTWuWAD4AmgbsADg&tab=5v8j9u&viewId=vXzANM",
                desc: "智能表格 - 项目排期跟踪"
            },
            {
                name: "方案汇总表",
                type: "腾讯文档",
                icon: "📊",
                url: "https://doc.weixin.qq.com/sheet/e3_ARoAOAZwAKoCNwQkAe12rTve0r3t3?scode=ANYAEAdoABEANLIZ4tAD4AmgbsADg&tab=gg88rc",
                desc: "表格 - 方案汇总整理"
            },
            {
                name: "猫耳市集设计",
                type: "Figma",
                icon: "🎨",
                url: "https://www.figma.com/design/BD5yWZD7sAohhOGMKDXA1a/%E7%8C%AB%E8%80%B3%E5%B8%82%E9%9B%86?node-id=2646-6&t=Os8QFH0oBeVZPaJG-1",
                desc: "UI/UX 主设计方案"
            },
            {
                name: "场景立绘",
                type: "Figma",
                icon: "🖼️",
                isGroup: true,
                baseUrl: "https://www.figma.com/design/mx6TmWTBvzD3UgvlUV07Im/%E7%8C%AB%E8%80%B3%E5%B8%82%E9%9B%86%E5%9C%BA%E6%99%AF-%E7%AB%8B%E7%BB%98",
                pages: [
                    { name: "一期资源", nodeId: "0-1" },
                    { name: "二期资源需求", nodeId: "532-5" }
                ],
                desc: "美术资源 - 场景与立绘"
            },
            {
                name: "原画共享表",
                type: "Canva",
                icon: "✨",
                url: "https://www.canva.cn/design/DAHCZyw0w4U/KfOdxMgbpZatrK0Kjf576w/edit",
                desc: "可画 - 美术原画资源共享"
            }
        ];

        // 从 localStorage 加载配置（带版本检查）
        const savedVersion = localStorage.getItem('meetingConfigVersion');
        let config = (savedVersion == CONFIG_VERSION) ? (JSON.parse(localStorage.getItem('meetingConfig')) || defaultConfig) : defaultConfig;
        
        // 保存当前版本号
        localStorage.setItem('meetingConfigVersion', CONFIG_VERSION);

        let currentIndex = -1;
        let currentSubIndex = 0;
        let expandedGroup = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateTime();
            setInterval(updateTime, 1000);
            
            // 恢复展开状态
            expandedGroup = localStorage.getItem('expandedGroup');
            if (expandedGroup !== null) {
                document.querySelector(`.nav-group:has([data-index="${expandedGroup}"])`)?.classList.add('expanded');
            }
            
            // 如果有保存的当前索引，自动加载
            const savedIndex = localStorage.getItem('currentIndex');
            const savedSubIndex = localStorage.getItem('currentSubIndex');
            if (savedIndex !== null) {
                switchTab(parseInt(savedIndex), savedSubIndex !== null ? parseInt(savedSubIndex) : 0);
            }
        });

        function toggleGroup(index) {
            const group = document.querySelector(`.nav-group:has([data-index="${index}"])`);
            if (group) {
                const isExpanded = group.classList.contains('expanded');
                if (isExpanded) {
                    group.classList.remove('expanded');
                    expandedGroup = null;
                } else {
                    group.classList.add('expanded');
                    expandedGroup = index;
                }
                localStorage.setItem('expandedGroup', expandedGroup);
            }
        }

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('current-time').textContent = timeStr;
        }

        function switchTab(index, subIndex = 0) {
            currentIndex = index;
            currentSubIndex = subIndex;
            localStorage.setItem('currentIndex', index);
            localStorage.setItem('currentSubIndex', subIndex);

            const item = config[index];
            
            // 如果是组，展开它
            if (item.isGroup) {
                const group = document.querySelector(`.nav-group:has([data-index="${index}"])`);
                if (group) {
                    group.classList.add('expanded');
                    expandedGroup = index;
                    localStorage.setItem('expandedGroup', expandedGroup);
                }
                // 显示子 Tab 栏
                document.getElementById('sub-tabs').classList.add('show');
                // 更新子 Tab 状态
                document.querySelectorAll('.sub-tab').forEach((tab, i) => {
                    if (i === subIndex) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });
            } else {
                // 隐藏子 Tab 栏
                document.getElementById('sub-tabs').classList.remove('show');
            }

            // 更新导航样式
            document.querySelectorAll('.nav-item').forEach((navItem, i) => {
                const navIndex = parseInt(navItem.dataset.index);
                const navSubIndex = navItem.dataset.subindex !== undefined ? parseInt(navItem.dataset.subindex) : -1;
                
                navItem.classList.remove('active');
                if (navIndex === index) {
                    if (item.isGroup) {
                        // 组内的子项
                        if (navSubIndex === subIndex) {
                            navItem.classList.add('active');
                        }
                    } else {
                        // 普通项
                        navItem.classList.add('active');
                    }
                }
            });

            // 加载内容
            loadContent(item, subIndex);
        }

        function switchSubTab(subIndex) {
            if (currentIndex >= 0) {
                switchTab(currentIndex, subIndex);
            }
        }

        function loadContent(item, subIndex = 0) {
            const container = document.getElementById('iframe-container');
            const urlDisplay = document.getElementById('url-display');
            
            let displayUrl = item.url;
            let embedUrl = item.url;
            
            // 处理组图的特殊逻辑
            if (item.isGroup && item.pages) {
                const page = item.pages[subIndex];
                displayUrl = `${item.baseUrl}?node-id=${page.nodeId}`;
                embedUrl = displayUrl;
            }
            
            urlDisplay.textContent = displayUrl;

            // 处理腾讯文档 - 不支持 iframe，直接显示提示
            if (item.type === '腾讯文档' || displayUrl.includes('doc.weixin.qq.com')) {
                container.innerHTML = `
                    <div class="external-link-prompt">
                        <div class="icon">📄</div>
                        <h3>腾讯文档需要在新标签页打开</h3>
                        <p>
                            由于企业微信安全限制，文档无法在页面内嵌入显示<br>
                            点击下方按钮在新标签页查看
                        </p>
                        <button class="external-link-btn" onclick="window.open('${displayUrl}', '_blank')">
                            ↗️ 在新标签页打开文档
                        </button>
                    </div>
                `;
                return;
            }

            // 处理 Canva - 编辑链接不支持 iframe
            if (item.type === 'Canva' || displayUrl.includes('canva.cn') || displayUrl.includes('canva.com')) {
                container.innerHTML = `
                    <div class="external-link-prompt">
                        <div class="icon">✨</div>
                        <h3>Canva 需要在新标签页打开</h3>
                        <p>
                            Canva 编辑模式不支持页面内嵌入显示<br>
                            点击下方按钮在新标签页查看
                        </p>
                        <button class="external-link-btn" onclick="window.open('${displayUrl}', '_blank')">
                            ↗️ 在新标签页打开 Canva
                        </button>
                    </div>
                `;
                return;
            }

            // 显示加载状态
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载 ${item.isGroup ? item.pages[subIndex].name : item.name}...</p>
                </div>
            `;

            // 处理 Figma 嵌入链接
            setTimeout(() => {
                if (item.type === 'Figma' || displayUrl.includes('figma.com')) {
                    // 使用 Figma 官方嵌入
                    embedUrl = `https://www.figma.com/embed?embed_host=share&url=${encodeURIComponent(displayUrl)}`;
                }
                
                container.innerHTML = `
                    <iframe 
                        src="${embedUrl}" 
                        allow="fullscreen" 
                        frameborder="0"
                    ></iframe>
                `;
            }, 500);
        }

        function refreshFrame() {
            if (currentIndex >= 0) {
                switchTab(currentIndex, currentSubIndex);
            }
        }

        function openInNewTab() {
            if (currentIndex >= 0) {
                const item = config[currentIndex];
                let url = item.url;
                if (item.isGroup && item.pages) {
                    const page = item.pages[currentSubIndex];
                    url = `${item.baseUrl}?node-id=${page.nodeId}`;
                }
                window.open(url, '_blank');
            }
        }

        function openEditModal() {
            const modal = document.getElementById('edit-modal');
            const forms = document.getElementById('edit-forms');
            
            forms.innerHTML = config.map((item, index) => {
                if (item.isGroup) {
                    // 组图显示多个输入框
                    return `
                        <div class="form-group">
                            <label>${item.icon} ${item.name} - 文件基础地址</label>
                            <input type="text" id="url-${index}-base" value="${item.baseUrl}" placeholder="Figma 文件基础链接">
                            <small style="color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 4px; display: block;">${item.desc}</small>
                        </div>
                        ${item.pages.map((page, pIndex) => `
                            <div class="form-group" style="padding-left: 20px;">
                                <label style="font-weight: normal; color: rgba(255,255,255,0.5);">${page.name} - Node ID</label>
                                <input type="text" id="url-${index}-page-${pIndex}" value="${page.nodeId}" placeholder="node-id">
                            </div>
                        `).join('')}
                    `;
                } else {
                    return `
                        <div class="form-group">
                            <label>${item.icon} ${item.name} 链接地址</label>
                            <input type="text" id="url-${index}" value="${item.url}" placeholder="请输入 ${item.type} 链接">
                            <small style="color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 4px; display: block;">${item.desc}</small>
                        </div>
                    `;
                }
            }).join('');
            
            modal.classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('show');
        }

        function saveLinks() {
            config.forEach((item, index) => {
                if (item.isGroup) {
                    // 保存组图的基础 URL
                    const baseInput = document.getElementById(`url-${index}-base`);
                    if (baseInput) {
                        item.baseUrl = baseInput.value.trim();
                    }
                    // 保存每个页面的 nodeId
                    item.pages.forEach((page, pIndex) => {
                        const pageInput = document.getElementById(`url-${index}-page-${pIndex}`);
                        if (pageInput) {
                            page.nodeId = pageInput.value.trim();
                        }
                    });
                } else {
                    const input = document.getElementById(`url-${index}`);
                    if (input) {
                        item.url = input.value.trim();
                    }
                }
            });
            
            localStorage.setItem('meetingConfig', JSON.stringify(config));
            localStorage.setItem('meetingConfigVersion', CONFIG_VERSION);
            closeEditModal();
            
            // 如果当前有选中的标签，刷新它
            if (currentIndex >= 0) {
                switchTab(currentIndex, currentSubIndex);
            }
            
            // 显示保存成功提示
            showToast('链接已保存！');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
                color: white;
                padding: 14px 24px;
                border-radius: 12px;
                font-size: 14px;
                font-weight: 500;
                z-index: 9999;
                animation: slideIn 0.3s ease;
                box-shadow: 0 8px 30px rgba(184, 41, 221, 0.4);
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5' && !e.ctrlKey && !e.metaKey) {
                const index = parseInt(e.key) - 1;
                if (index < config.length) {
                    switchTab(index, 0);
                }
            }
            // Tab 键在组图内切换子页面
            if (e.key === 'Tab' && currentIndex >= 0 && config[currentIndex].isGroup) {
                e.preventDefault();
                const item = config[currentIndex];
                const nextSubIndex = (currentSubIndex + 1) % item.pages.length;
                switchTab(currentIndex, nextSubIndex);
            }
            if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                refreshFrame();
            }
        });

        // 点击遮罩关闭弹窗
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
