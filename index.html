<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏项目周会 · 资源展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f5f5f7;
        }

        /* 顶部标题栏 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            font-size: 24px;
        }

        /* 主布局 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 12px;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 16px;
        }

        .nav-section-title {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            background: #f8f9fa;
        }

        .nav-item:hover {
            background: #f0f0f0;
            transform: translateX(2px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }

        .nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .nav-item:nth-child(1) .nav-icon { background: #00c85320; color: #00c853; }
        .nav-item:nth-child(2) .nav-icon { background: #ff6d0020; color: #ff6d00; }
        .nav-item:nth-child(3) .nav-icon { background: #2962ff20; color: #2962ff; }

        /* 导航组样式 */
        .nav-group {
            display: flex;
            flex-direction: column;
        }

        .nav-group-header {
            position: relative;
            background: #f8f9fa;
        }

        .nav-group-header .nav-icon {
            background: #e91e6320 !important;
            color: #e91e63 !important;
        }

        .nav-arrow {
            font-size: 10px;
            color: #999;
            transition: transform 0.2s;
            margin-left: auto;
            padding-left: 8px;
        }

        .nav-group.expanded .nav-arrow {
            transform: rotate(90deg);
        }

        .nav-subitems {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding-left: 16px;
            margin-top: 8px;
        }

        .nav-group.expanded .nav-subitems {
            display: flex;
        }

        .nav-subitem {
            padding: 10px 14px;
            background: #fafafa;
        }

        .nav-subitem:hover {
            background: #f0f0f0;
        }

        .nav-subitem.active {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-color: #667eea;
        }

        .nav-subicon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #999;
        }

        .nav-subitem.active .nav-subicon {
            color: #667eea;
        }

        .nav-item:nth-child(4) .nav-icon { background: #00bcd420; color: #00bcd4; }

        /* 导航组样式 */
        .nav-group {
            display: flex;
            flex-direction: column;
        }

        .nav-group-header {
            position: relative;
        }

        .nav-arrow {
            font-size: 10px;
            color: #999;
            transition: transform 0.2s;
            margin-left: auto;
        }

        .nav-group.expanded .nav-arrow {
            transform: rotate(90deg);
        }

        .nav-subitems {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding-left: 16px;
            margin-top: 8px;
        }

        .nav-group.expanded .nav-subitems {
            display: flex;
        }

        .nav-subitem {
            padding: 10px 14px;
            background: #fafafa;
        }

        .nav-subitem:hover {
            background: #f0f0f0;
        }

        .nav-subitem.active {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border-color: #667eea;
        }

        .nav-subicon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #999;
        }

        .nav-subitem.active .nav-subicon {
            color: #667eea;
        }

        /* 子 Tab 工具栏 */
        .sub-tabs {
            display: none;
            height: 42px;
            background: #f5f5f7;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 20px;
            align-items: center;
            gap: 8px;
        }

        .sub-tabs.show {
            display: flex;
        }

        .sub-tab {
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #666;
        }

        .sub-tab:hover {
            background: #e8e8e8;
        }

        .sub-tab.active {
            background: #667eea;
            color: white;
        }

        .nav-content {
            flex: 1;
            min-width: 0;
        }

        .nav-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }

        .nav-desc {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 快捷操作 */
        .quick-actions {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: 1px dashed #ccc;
            border-radius: 10px;
            background: #fafafa;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:hover {
            border-color: #667eea;
            color: #667eea;
            background: #f0f0ff;
        }

        /* 内容区域 */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
        }

        .toolbar {
            height: 50px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }

        .url-display {
            flex: 1;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            color: #666;
            font-family: 'SF Mono', Monaco, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tool-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn:hover {
            background: #5a6fd6;
            transform: translateY(-1px);
        }

        .tool-btn.secondary {
            background: #f0f0f0;
            color: #666;
        }

        .tool-btn.secondary:hover {
            background: #e0e0e0;
        }

        /* iframe 容器 */
        .iframe-container {
            flex: 1;
            position: relative;
            background: #f5f5f7;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* 加载状态 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #999;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            color: #666;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 300px;
            line-height: 1.6;
        }

        /* 编辑弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 480px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: #f0f0f0;
            border: none;
            color: #666;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .btn-save {
            background: #667eea;
            border: none;
            color: white;
        }

        .btn-save:hover {
            background: #5a6fd6;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                z-index: 100;
                height: auto;
                max-height: 50vh;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }

            .main-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部标题栏 -->
    <header class="header">
        <h1>
            <span class="header-icon">🎮</span>
            游戏项目周会 · 资源展示
        </h1>
        <span id="current-time"></span>
    </header>

    <!-- 主布局 -->
    <div class="main-container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="nav-section">
                <div class="nav-section-title">会议资源</div>
                
                <div class="nav-item active" data-index="0" onclick="switchTab(0)">
                    <div class="nav-icon">📅</div>
                    <div class="nav-content">
                        <div class="nav-title">设计排期表</div>
                        <div class="nav-desc">腾讯文档 - 项目排期</div>
                    </div>
                </div>

                <div class="nav-item" data-index="1" onclick="switchTab(1)">
                    <div class="nav-icon">📊</div>
                    <div class="nav-content">
                        <div class="nav-title">方案汇总表</div>
                        <div class="nav-desc">腾讯文档 - 方案整理</div>
                    </div>
                </div>

                <div class="nav-item" data-index="2" onclick="switchTab(2)">
                    <div class="nav-icon">🎨</div>
                    <div class="nav-content">
                        <div class="nav-title">猫耳市集设计</div>
                        <div class="nav-desc">Figma - UI/UX 设计</div>
                    </div>
                </div>

                <div class="nav-group">
                    <div class="nav-item nav-group-header" data-index="3" onclick="toggleGroup(3)">
                        <div class="nav-icon">🖼️</div>
                        <div class="nav-content">
                            <div class="nav-title">场景立绘</div>
                            <div class="nav-desc">Figma - 美术资源</div>
                        </div>
                        <div class="nav-arrow">▶</div>
                    </div>
                    <div class="nav-subitems" id="group-3">
                        <div class="nav-item nav-subitem" data-index="3" data-subindex="0" onclick="switchTab(3, 0)">
                            <div class="nav-subicon">•</div>
                            <div class="nav-content">
                                <div class="nav-title">一期资源</div>
                            </div>
                        </div>
                        <div class="nav-item nav-subitem" data-index="3" data-subindex="1" onclick="switchTab(3, 1)">
                            <div class="nav-subicon">•</div>
                            <div class="nav-content">
                                <div class="nav-title">二期资源需求</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="nav-item" data-index="4" onclick="switchTab(4)">
                    <div class="nav-icon">✨</div>
                    <div class="nav-content">
                        <div class="nav-title">原画共享表</div>
                        <div class="nav-desc">Canva - 美术资源</div>
                    </div>
                </div>
            </div>

            <div class="quick-actions">
                <button class="action-btn" onclick="openEditModal()">
                    <span>⚙️</span> 编辑链接地址
                </button>
            </div>
        </aside>

        <!-- 内容区域 -->
        <main class="content-area">
            <div class="toolbar">
                <div class="url-display" id="url-display">点击左侧切换资源...</div>
                <button class="tool-btn secondary" onclick="refreshFrame()">🔄 刷新</button>
                <button class="tool-btn" onclick="openInNewTab()">↗️ 新标签打开</button>
            </div>
            
            <!-- 子 Tab 栏（场景立绘专用） -->
            <div class="sub-tabs" id="sub-tabs">
                <div class="sub-tab active" data-subindex="0" onclick="switchSubTab(0)">一期资源</div>
                <div class="sub-tab" data-subindex="1" onclick="switchSubTab(1)">二期资源需求</div>
            </div>
            
            <div class="iframe-container" id="iframe-container">
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <h3>选择左侧资源开始展示</h3>
                    <p>点击左侧导航栏中的项目，即可在此处展示对应的内容</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <h3>编辑资源链接</h3>
            <div id="edit-forms">
                <!-- 动态生成 -->
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn-save" onclick="saveLinks()">保存设置</button>
            </div>
        </div>
    </div>

    <script>
        // 配置版本号，更新时递增以强制刷新用户配置
        const CONFIG_VERSION = 2;

        // 默认配置
        const defaultConfig = [
            {
                name: "设计排期表",
                type: "腾讯文档",
                icon: "📅",
                url: "https://doc.weixin.qq.com/smartsheet/s3_AD4AmgbsADgCN4Q8LjjrlT7GH14cF?scode=ANYAEAdoABEyhUTWuWAD4AmgbsADg&tab=5v8j9u&viewId=vXzANM",
                desc: "智能表格 - 项目排期跟踪"
            },
            {
                name: "方案汇总表",
                type: "腾讯文档",
                icon: "📊",
                url: "https://doc.weixin.qq.com/sheet/e3_ARoAOAZwAKoCNwQkAe12rTve0r3t3?scode=ANYAEAdoABEANLIZ4tAD4AmgbsADg&tab=gg88rc",
                desc: "表格 - 方案汇总整理"
            },
            {
                name: "猫耳市集设计",
                type: "Figma",
                icon: "🎨",
                url: "https://www.figma.com/design/BD5yWZD7sAohhOGMKDXA1a/%E7%8C%AB%E8%80%B3%E5%B8%82%E9%9B%86?node-id=2646-6&t=Os8QFH0oBeVZPaJG-1",
                desc: "UI/UX 主设计方案"
            },
            {
                name: "场景立绘",
                type: "Figma",
                icon: "🖼️",
                isGroup: true,
                baseUrl: "https://www.figma.com/design/mx6TmWTBvzD3UgvlUV07Im/%E7%8C%AB%E8%80%B3%E5%B8%82%E9%9B%86%E5%9C%BA%E6%99%AF-%E7%AB%8B%E7%BB%98",
                pages: [
                    { name: "一期资源", nodeId: "928-9" },
                    { name: "二期资源需求", nodeId: "939-3" }
                ],
                desc: "美术资源 - 场景与立绘"
            },
            {
                name: "原画共享表",
                type: "Canva",
                icon: "✨",
                url: "https://www.canva.cn/design/DAHCZyw0w4U/KfOdxMgbpZatrK0Kjf576w/edit",
                desc: "可画 - 美术原画资源共享"
            }
        ];

        // 从 localStorage 加载配置（带版本检查）
        const savedVersion = localStorage.getItem('meetingConfigVersion');
        let config = (savedVersion == CONFIG_VERSION) ? (JSON.parse(localStorage.getItem('meetingConfig')) || defaultConfig) : defaultConfig;
        
        // 保存当前版本号
        localStorage.setItem('meetingConfigVersion', CONFIG_VERSION);
        let currentIndex = -1;
        let currentSubIndex = 0;
        let expandedGroup = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateTime();
            setInterval(updateTime, 1000);
            
            // 恢复展开状态
            expandedGroup = localStorage.getItem('expandedGroup');
            if (expandedGroup !== null) {
                document.querySelector(`.nav-group:has([data-index="${expandedGroup}"])`)?.classList.add('expanded');
            }
            
            // 如果有保存的当前索引，自动加载
            const savedIndex = localStorage.getItem('currentIndex');
            const savedSubIndex = localStorage.getItem('currentSubIndex');
            if (savedIndex !== null) {
                switchTab(parseInt(savedIndex), savedSubIndex !== null ? parseInt(savedSubIndex) : 0);
            }
        });

        function toggleGroup(index) {
            const group = document.querySelector(`.nav-group:has([data-index="${index}"])`);
            if (group) {
                const isExpanded = group.classList.contains('expanded');
                if (isExpanded) {
                    group.classList.remove('expanded');
                    expandedGroup = null;
                } else {
                    group.classList.add('expanded');
                    expandedGroup = index;
                }
                localStorage.setItem('expandedGroup', expandedGroup);
            }
        }

        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('current-time').textContent = timeStr;
        }

        function switchTab(index, subIndex = 0) {
            currentIndex = index;
            currentSubIndex = subIndex;
            localStorage.setItem('currentIndex', index);
            localStorage.setItem('currentSubIndex', subIndex);

            const item = config[index];
            
            // 如果是组，展开它
            if (item.isGroup) {
                const group = document.querySelector(`.nav-group:has([data-index="${index}"])`);
                if (group) {
                    group.classList.add('expanded');
                    expandedGroup = index;
                    localStorage.setItem('expandedGroup', expandedGroup);
                }
                // 显示子 Tab 栏
                document.getElementById('sub-tabs').classList.add('show');
                // 更新子 Tab 状态
                document.querySelectorAll('.sub-tab').forEach((tab, i) => {
                    if (i === subIndex) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });
            } else {
                // 隐藏子 Tab 栏
                document.getElementById('sub-tabs').classList.remove('show');
            }

            // 更新导航样式
            document.querySelectorAll('.nav-item').forEach((navItem, i) => {
                const navIndex = parseInt(navItem.dataset.index);
                const navSubIndex = navItem.dataset.subindex !== undefined ? parseInt(navItem.dataset.subindex) : -1;
                
                navItem.classList.remove('active');
                if (navIndex === index) {
                    if (item.isGroup) {
                        // 组内的子项
                        if (navSubIndex === subIndex) {
                            navItem.classList.add('active');
                        }
                    } else {
                        // 普通项
                        navItem.classList.add('active');
                    }
                }
            });

            // 加载内容
            loadContent(item, subIndex);
        }

        function switchSubTab(subIndex) {
            if (currentIndex >= 0) {
                switchTab(currentIndex, subIndex);
            }
        }

        function loadContent(item, subIndex = 0) {
            const container = document.getElementById('iframe-container');
            const urlDisplay = document.getElementById('url-display');
            
            let displayUrl = item.url;
            let embedUrl = item.url;
            
            // 处理组图的特殊逻辑
            if (item.isGroup && item.pages) {
                const page = item.pages[subIndex];
                displayUrl = `${item.baseUrl}?node-id=${page.nodeId}`;
                embedUrl = displayUrl;
            }
            
            urlDisplay.textContent = displayUrl;

            // 处理腾讯文档 - 不支持 iframe，直接显示提示
            if (item.type === '腾讯文档' || displayUrl.includes('doc.weixin.qq.com')) {
                container.innerHTML = `
                    <div class="empty-state" style="text-align: center; padding: 60px;">
                        <div style="font-size: 64px; margin-bottom: 20px;">📄</div>
                        <h3 style="font-size: 20px; color: #333; margin-bottom: 12px;">腾讯文档需要在新标签页打开</h3>
                        <p style="color: #666; margin-bottom: 24px; line-height: 1.6;">
                            由于企业微信安全限制，文档无法在页面内嵌入显示<br>
                            点击下方按钮在新标签页查看
                        </p>
                        <button onclick="window.open('${displayUrl}', '_blank')" 
                                style="padding: 12px 28px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.2s;">
                            ↗️ 在新标签页打开文档
                        </button>
                    </div>
                `;
                return;
            }

            // 处理 Canva - 编辑链接不支持 iframe
            if (item.type === 'Canva' || displayUrl.includes('canva.cn') || displayUrl.includes('canva.com')) {
                container.innerHTML = `
                    <div class="empty-state" style="text-align: center; padding: 60px;">
                        <div style="font-size: 64px; margin-bottom: 20px;">✨</div>
                        <h3 style="font-size: 20px; color: #333; margin-bottom: 12px;">Canva 需要在新标签页打开</h3>
                        <p style="color: #666; margin-bottom: 24px; line-height: 1.6;">
                            Canva 编辑模式不支持页面内嵌入显示<br>
                            点击下方按钮在新标签页查看
                        </p>
                        <button onclick="window.open('${displayUrl}', '_blank')" 
                                style="padding: 12px 28px; background: #00bcd4; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.2s;">
                            ↗️ 在新标签页打开 Canva
                        </button>
                    </div>
                `;
                return;
            }

            // 显示加载状态
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载 ${item.isGroup ? item.pages[subIndex].name : item.name}...</p>
                </div>
            `;

            // 处理 Figma 嵌入链接
            setTimeout(() => {
                if (item.type === 'Figma' || displayUrl.includes('figma.com')) {
                    // 使用 Figma 官方嵌入
                    embedUrl = `https://www.figma.com/embed?embed_host=share&url=${encodeURIComponent(displayUrl)}`;
                }
                
                container.innerHTML = `
                    <iframe 
                        src="${embedUrl}" 
                        allow="fullscreen" 
                        frameborder="0"
                    ></iframe>
                `;
            }, 500);
        }

        function refreshFrame() {
            if (currentIndex >= 0) {
                switchTab(currentIndex, currentSubIndex);
            }
        }

        function openInNewTab() {
            if (currentIndex >= 0) {
                const item = config[currentIndex];
                let url = item.url;
                if (item.isGroup && item.pages) {
                    const page = item.pages[currentSubIndex];
                    url = `${item.baseUrl}?node-id=${page.nodeId}`;
                }
                window.open(url, '_blank');
            }
        }

        function openEditModal() {
            const modal = document.getElementById('edit-modal');
            const forms = document.getElementById('edit-forms');
            
            forms.innerHTML = config.map((item, index) => {
                if (item.isGroup) {
                    // 组图显示多个输入框
                    return `
                        <div class="form-group">
                            <label>${item.icon} ${item.name} - 文件基础地址</label>
                            <input type="text" id="url-${index}-base" value="${item.baseUrl}" placeholder="Figma 文件基础链接">
                            <small style="color: #999; font-size: 12px; margin-top: 4px; display: block;">${item.desc}</small>
                        </div>
                        ${item.pages.map((page, pIndex) => `
                            <div class="form-group" style="padding-left: 20px;">
                                <label style="font-weight: normal; color: #888;">${page.name} - Node ID</label>
                                <input type="text" id="url-${index}-page-${pIndex}" value="${page.nodeId}" placeholder="node-id">
                            </div>
                        `).join('')}
                    `;
                } else {
                    return `
                        <div class="form-group">
                            <label>${item.icon} ${item.name} 链接地址</label>
                            <input type="text" id="url-${index}" value="${item.url}" placeholder="请输入 ${item.type} 链接">
                            <small style="color: #999; font-size: 12px; margin-top: 4px; display: block;">${item.desc}</small>
                        </div>
                    `;
                }
            }).join('');
            
            modal.classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('show');
        }

        function saveLinks() {
            config.forEach((item, index) => {
                if (item.isGroup) {
                    // 保存组图的基础 URL
                    const baseInput = document.getElementById(`url-${index}-base`);
                    if (baseInput) {
                        item.baseUrl = baseInput.value.trim();
                    }
                    // 保存每个页面的 nodeId
                    item.pages.forEach((page, pIndex) => {
                        const pageInput = document.getElementById(`url-${index}-page-${pIndex}`);
                        if (pageInput) {
                            page.nodeId = pageInput.value.trim();
                        }
                    });
                } else {
                    const input = document.getElementById(`url-${index}`);
                    if (input) {
                        item.url = input.value.trim();
                    }
                }
            });
            
            localStorage.setItem('meetingConfig', JSON.stringify(config));
            localStorage.setItem('meetingConfigVersion', CONFIG_VERSION);
            closeEditModal();
            
            // 如果当前有选中的标签，刷新它
            if (currentIndex >= 0) {
                switchTab(currentIndex, currentSubIndex);
            }
            
            // 显示保存成功提示
            showToast('链接已保存！');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #00c853;
                color: white;
                padding: 12px 20px;
                border-radius: 10px;
                font-size: 14px;
                z-index: 9999;
                animation: slideIn 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5' && !e.ctrlKey && !e.metaKey) {
                const index = parseInt(e.key) - 1;
                if (index < config.length) {
                    switchTab(index, 0);
                }
            }
            // Tab 键在组图内切换子页面
            if (e.key === 'Tab' && currentIndex >= 0 && config[currentIndex].isGroup) {
                e.preventDefault();
                const item = config[currentIndex];
                const nextSubIndex = (currentSubIndex + 1) % item.pages.length;
                switchTab(currentIndex, nextSubIndex);
            }
            if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                refreshFrame();
            }
        });

        // 点击遮罩关闭弹窗
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
